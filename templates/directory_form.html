<p class="note"><!--i18n-->別のフォルダーを管理対象に切り替えます。スキルのファイルは移動しません。<!--/i18n--></p>
<form method="post" action="/sources/directory" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="mode" value="custom">
  <label><!--i18n-->参照するフォルダー（絶対パス）<!--/i18n--><input name="path" value="{{ self.display_path(directory_path) }}" required placeholder="例: D:\Skills または /Users/you/Skills" spellcheck="false"></label>
  <div><button type="submit" data-busy="変更中…"><!--i18n-->参照先を変更<!--/i18n--></button></div>
</form>
