<form method="post" action="/sources/migrate" class="stack" data-confirm="元のフォルダーを移動先へ丸ごと移動し、有効なスキルをすべてMCP公開します。元の場所には残りません。MCP接続を確認したうえで実行しますか？">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="alias" value="{{ s.alias }}">
  <label><!--i18n-->移動先（絶対パス）<!--/i18n--><input name="destination" value="{{ self.display_path(self.destination_for(s)) }}" required spellcheck="false"></label>
  <p class="note"><!--i18n-->元のフォルダーを丸ごと移動し、有効な<!--/i18n-->{{ s.mcp_candidate_count }}<!--i18n-->件をMCP公開します。移動後はCodexを再起動してください。<!--/i18n--></p>
  <div><button type="submit" class="primary" data-busy="移動中…"><!--i18n-->この保存先へ移動<!--/i18n--></button></div>
</form>
