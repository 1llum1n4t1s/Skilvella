<!doctype html>
<html lang="{{ locale.language() }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Skilvella{% endblock %}</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-180.png"><script src="/assets/policy-navigation.js"></script><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js" defer></script></head>
<body data-client-messages="{{ locale.client_messages() }}"{% if let Some(name) = locale.migration_cookie() %} data-language-cookie="{{ name }}"{% endif %}><div class="policy-recovery" role="status" id="policy-recovery-status">{{ locale.text("保存中…") }}</div><a class="skip" href="#main">{{ locale.text("本文へ移動") }}</a><header class="topbar"><a class="brand" href="/"><img src="/assets/icon-32.png" alt="" width="32" height="32">Skilvella<span>{{ locale.text("スキル管理") }}</span></a><div class="header-tools"><nav aria-label="{{ locale.text("メイン") }}"><a href="/" aria-current="{% block library_current %}false{% endblock %}">{{ locale.text("ライブラリ") }}</a><a href="/sources" aria-current="{% block folders_current %}false{% endblock %}">{{ locale.text("フォルダー") }}</a><a class="button primary small" href="/skills/new" aria-current="{% block new_current %}false{% endblock %}">{{ locale.text("＋ 新規スキル") }}</a><a href="/settings" aria-current="{% block settings_current %}false{% endblock %}">{{ locale.text("設定") }}</a></nav></div></header><main id="main">{% block content %}{% endblock %}</main><footer>{{ locale.text("Skilvella · ローカルライブラリ") }}</footer></body></html>
