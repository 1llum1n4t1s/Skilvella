{% block content %}<div class="heading"><h1>未保存の下書き</h1></div><div class="notice warning" role="alert">{{ message }}</div><section class="panel"><p>編集した本文と保存前のリビジョンを保持しています。先に本文をコピーし、フォルダーの接続・読み取り権限を確認してください。</p><p><a href="/skills/{{ id }}">最新版を開く</a></p><form method="post" action="/skills/{{ id }}/content" data-editor data-dirty="true"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="revision" value="{{ revision }}"><label for="content">SKILL.md の全文（未保存）</label><textarea class="code-editor" id="content" name="content" spellcheck="false" required>{{ content }}</textarea><div class="actions"><button type="submit" class="primary" data-busy="保存中…">接続・権限の復旧後に保存を再試行</button></div></form></section>{% endblock %}
