[package]
name = "skilvella"
version = "1.1.5"
edition = "2024"
rust-version = "1.89"
description = "A local skill library with a browser manager and three MCP tools"
license = "MIT"
repository = "https://github.com/1llum1n4t1s/Skilvella"
default-run = "skilvella"

[features]
launcher = []
windows-installer = ["dep:velopack"]
release-tools = []
release-update-test = ["release-tools", "dep:rcgen", "dep:rustls"]

[[bin]]
name = "skilvella-release"
path = "src/bin/skilvella-release.rs"
required-features = ["release-tools"]

[[bin]]
name = "skilvella-launcher"
path = "src/bin/skilvella-launcher.rs"
required-features = ["launcher"]

[[test]]
name = "launcher"
path = "tests/launcher.rs"
required-features = ["launcher"]

[[test]]
name = "release_update"
path = "tests/release_update.rs"
harness = false
test = false
required-features = ["release-update-test"]

[dependencies]
anyhow = "1"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
comrak = { version = "0.59.0", default-features = false }
notify = "8"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
saphyr = "0.3.3"
saphyr-parser = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
velopack = { version = "=1.2.161", default-features = false, optional = true }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDate", "NSGeometry", "NSObject", "NSRunLoop", "NSString", "NSTimer", "NSURL"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
