[package]
name = "skilvella"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "A local skill library with a browser manager and three MCP tools"
license = "MIT"
repository = "https://github.com/1llum1n4t1s/Skilvella"

[dependencies]
anyhow = "1"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
comrak = { version = "0.59.0", default-features = false }
notify = "8"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
saphyr = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
