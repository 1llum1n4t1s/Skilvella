name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os == 'macos-latest' && fromJSON('["self-hosted", "macOS", "ARM64", "m3mb14"]') || matrix.os == 'ubuntu-latest' && fromJSON('["self-hosted", "Linux", "ARM64", "m3mb14"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - run: cargo fmt --all --check
      # launcher 機能は `launcher = []` で依存を追加せず、src・tests に cfg(feature = "launcher") の分岐もない。
      # そのため機能付きの1回の実行で、既定機能の全ターゲットと起動補助（bin・テスト）を同じ条件で検査できる。
      # launcher 機能が依存や条件分岐を持つようになったら、機能なしの実行を分けて戻すこと。
      - run: cargo clippy --locked --all-targets --features launcher -- -D warnings
      # 公開前の更新回帰テストと配布ツールは既定機能では対象外のため、専用の機能で別に検査する。
      - run: cargo clippy --locked --features release-update-test --bin skilvella-release --test release_update -- -D warnings
      - run: cargo test --locked --features launcher
        env:
          SKILVELLA_MIGRATION_TEST_ROOT: ${{ runner.temp }}
      - run: cargo build --release --locked
