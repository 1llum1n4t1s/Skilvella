name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os == 'macos-latest' && fromJSON('["self-hosted", "macOS", "ARM64", "m3mb14"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      # 依存クレートのビルド結果を GitHub のキャッシュへ保存し、毎回の全依存コンパイルを避ける。
      # セルフホストランナーもジョブごとに作業フォルダーを初期化するため、同じキャッシュを使う。
      # キーはOS・ツールチェーン・Cargo.lock から作られ、依存が変われば作り直される。
      # cache-bin は必ず無効にする。有効だと後処理の「Cleaning cargo/bin」が、セルフホストランナーで
      # 共有している CARGO_HOME/bin の rustup 本体を消し、以後のジョブが rustup・cargo を実行できなくなる。
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: "false"
      - run: cargo fmt --all --check
      # launcher 機能は `launcher = []` で依存を追加せず、src・tests に cfg(feature = "launcher") の分岐もない。
      # そのため機能付きの1回の実行で、既定機能の全ターゲットと起動補助（bin・テスト）を同じ条件で検査できる。
      # launcher 機能が依存や条件分岐を持つようになったら、機能なしの実行を分けて戻すこと。
      - run: cargo clippy --locked --all-targets --features launcher -- -D warnings
      # 公開前の更新回帰テストと配布ツールは既定機能では対象外のため、専用の機能で別に検査する。
      - run: cargo clippy --locked --features release-update-test --bin skilvella-release --test release_update -- -D warnings
      - run: cargo test --locked --features launcher
        env:
          SKILVELLA_MIGRATION_TEST_ROOT: ${{ runner.temp }}
      # release プロファイル（thin LTO・codegen-units=1）のビルドは最も時間がかかり、確かめるのは
      # release 設定でビルドが通ることだけ（コードは clippy・テストでコンパイル済み）。
      # 公開前にも両OSで release ビルドを行うため、push ごとではなく release ブランチとタグで実行する。
      - if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked
