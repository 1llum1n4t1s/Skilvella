name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os == 'macos-latest' && fromJSON('["self-hosted", "macOS", "ARM64", "m3mb14"]') || matrix.os == 'ubuntu-latest' && fromJSON('["self-hosted", "Linux", "ARM64", "m3mb14"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --features launcher --bin skilvella-launcher --test launcher -- -D warnings
      - run: cargo test --locked
        env:
          SKILVELLA_MIGRATION_TEST_ROOT: ${{ runner.temp }}
      - run: cargo test --locked --features launcher --test launcher
        env:
          SKILVELLA_MIGRATION_TEST_ROOT: ${{ runner.temp }}
      - run: cargo build --release --locked
